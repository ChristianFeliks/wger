name: Build and push demo Docker image

# Only build when the dockerfile has changed, otherwise scheduled every two weeks
# (on the 1st and 15th every month) since it's not so important to keep this image
# exactly in sync with master
on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths:
      - 'extras/docker/demo/Dockerfile'
      - '.github/workflows/docker-demo.yml'
  schedule:
    - cron: '0 6 1,15 * *'

env:
  REGISTRY_REPO: ${{ vars.REGISTRY_REPO || 'wger' }}

jobs:
  demo:
    name: Build demo image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set registry repository
        id: registry
        run: |
          if [ -n "${{ vars.REGISTRY_REPO }}" ]; then
            echo "REPO=${{ vars.REGISTRY_REPO }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "REPO=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_ENV
          else
            echo "REPO=wger" >> $GITHUB_ENV
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: extras/docker/demo/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REPO }}/demo:latest,${{ env.REPO }}/demo:2.4-dev

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REPO }}/demo:latest
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
